apiVersion: apps/v1
kind: Deployment
metadata:
  name: seleniumtestdemoapp1-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: seleniumtestdemoapp1
  template:
    metadata:
      labels:
        app: seleniumtestdemoapp1
    spec:
      containers:
        - name: demoapp12
          image: shivani0824/week12app:v1
          imagePullPolicy: Always
          ports:
            - containerPort: 5000